<style>
  *{box-sizing:border-box}

  body{font-family:'Heebo',system-ui,sans-serif;color:#17140f;background:#fbfaf8;-webkit-font-smoothing:antialiased}
  img{display:block}
  .top{background:#1a1815;color:#fff;padding:0 20px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}

  .stat.acc .v{color:#a8e6c0}
  .bar{background:#fff;border-bottom:1px solid #e9e5df;padding:11px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:58px;z-index:98}

  .count{font-size:12px;color:#6b6660;margin-bottom:16px;font-weight:500}

  function UP(p){ return p.seriesMode ? Math.round(p.basePrice*(p.seriesPairs||1)*100)/100 : p.basePrice; }
  function UNIT(p){ return p.seriesMode ? (p.packPlural||'סדרות') : 'יח׳'; }

  function uniq(key){
    var out = [];
    DATA.products.forEach(function(p){ var v=p[key]; if(v && out.indexOf(v)<0) out.push(v); });
    return out.sort();
  }

  function renderFilters(){
    var bar = document.getElementById('filterBar');
    var genders = uniq('gender'), types = uniq('type');
    var html = '';
    if (genders.length > 1) {
      html += '<button class="pill'+(filters.gender==='הכל'?' on':'')+'" onclick="setF(\'gender\',\'הכל\')">כל המגדרים</button>';
      genders.forEach(function(g){ html += '<button class="pill'+(filters.gender===g?' on':'')+'" onclick="setF(\'gender\',\''+esc(g)+'\')">'+esc(g)+'</button>'; });
    }
    if (types.length > 1) {
      html += '<span style="width:1px;height:18px;background:#e9e5df;margin:0 4px"></span>';
      html += '<button class="pill'+(filters.type==='הכל'?' on':'')+'" onclick="setF(\'type\',\'הכל\')">כל הסוגים</button>';
      types.forEach(function(t){ html += '<button class="pill'+(filters.type===t?' on':'')+'" onclick="setF(\'type\',\''+esc(t)+'\')">'+esc(t)+'</button>'; });
    }
    var widths = uniq('width');
    if (widths.length > 1) {
      html += '<span style="width:1px;height:18px;background:#e9e5df;margin:0 4px"></span>';
      html += '<button class="pill'+(filters.width==='הכל'?' on':'')+'" onclick="setF(\'width\',\'הכל\')">כל הרחבים</button>';
      widths.forEach(function(w){ html += '<button class="pill'+(filters.width===w?' on':'')+'" onclick="setF(\'width\',\''+esc(w)+'\')">'+esc(w)+'</button>'; });

    bar.innerHTML = html;
  }
  function setF(k,v){ filters[k]=v; renderFilters(); render(); }
  function setQ(v){ query=v; render(); }

  function visible(){
    var ql = query.trim().toLowerCase();
    return DATA.products.map(function(p,i){ return {p:p,i:i}; }).filter(function(o){
      var p=o.p;
      if (filters.gender!=='הכל' && p.gender!==filters.gender) return false;
      if (filters.type!=='הכל' && p.type!==filters.type) return false;
      if (filters.width!=='הכל' && p.width!==filters.width) return false;
      if (ql) {
        var hay = (p.sku+' '+p.name+' '+(p.color||'')+' '+(p.width||'')).toLowerCase();
        if (hay.indexOf(ql)<0) return false;
      }
      return true;
    });
  }

          return '<span><b>'+esc(rs.s)+'</b><i>×</i><u>'+rs.q+'</u></span>';

  function chg(pi, si, d){

      if (q>0) {
        var ex = cart.filter(function(c){return c.pid===pi&&c.sizeIdx===si;})[0];
        if (p.maxPacks) { var have = cart.filter(function(c){return c.pid===pi;}).reduce(function(a,c){return a+c.qty;},0); q = Math.min(q, Math.max(0, p.maxPacks - have)); }
        if (q <= 0) { draft[key]=0; var e0=document.getElementById('q-'+key); if(e0) e0.textContent='0'; return; }
        if (ex) ex.qty += q; else cart.push({pid:pi, sizeIdx:si, qty:q});
        draft[key]=0;
        var el=document.getElementById('q-'+key); if(el) el.textContent='0';
        any=true;
      }
    });
    if (any) { renderCart(); syncQtys(); }
  }
  function cartChg(pid, si, d){
    var ex = cart.filter(function(c){return c.pid===pid&&c.sizeIdx===si;})[0];
    if (!ex) return;
    var pp = DATA.products[pid];
    if (d > 0 && pp.maxPacks) { var tot = cart.filter(function(c){return c.pid===pid;}).reduce(function(a,c){return a+c.qty;},0); if (tot >= pp.maxPacks) return; }
    ex.qty += d;
    if (ex.qty <= 0) cart = cart.filter(function(c){return !(c.pid===pid&&c.sizeIdx===si);});
    renderCart(); syncQtys();
  }

  function renderCart(){
    var body = document.getElementById('cartBody');
    var models = {}, units = 0, total = 0;
    cart.forEach(function(c){ var p=DATA.products[c.pid]; models[c.pid]=1; units += pairsOf(p,c.qty); total += c.qty*UP(p); });
    document.getElementById('stModels').textContent = Object.keys(models).length;
    document.getElementById('stUnits').textContent = units;
    document.getElementById('stTotal').textContent = SYM+Math.round(total*100)/100;
    var fab = document.getElementById('fabTxt');
    if (fab) fab.textContent = cart.length ? ('העגלה · '+SYM+(Math.round(total*100)/100)) : 'העגלה';
    if (!cart.length) { body.innerHTML = '<div class="empty">העגלה ריקה</div>'; return; }
    var byPid = {};
    cart.forEach(function(c){ (byPid[c.pid] = byPid[c.pid] || []).push(c); });
    var html = '';
    Object.keys(byPid).forEach(function(pid){
      var p = DATA.products[pid], group = byPid[pid];
      var gt = group.reduce(function(a,c){return a+c.qty*UP(p);},0);
      var gq = group.reduce(function(a,c){return a+c.qty;},0);
      html += '<div class="cgroup"><div class="cg-t">'+esc(p.sku)+'</div>'+
        '<div class="cg-s">'+esc(p.name)+' · '+gq+' '+UNIT(p)+' · '+SYM+(Math.round(gt*100)/100)+'</div>';
      group.forEach(function(c){
        var s = p.sizes[c.sizeIdx];
        var lbl = p.seriesMode ? (PK(p)+' · '+(p.seriesPairs||0)+' '+PW(p)) : ('מידה '+s.s);
        html += '<div class="cline"><div class="ctrl">'+
          '<button class="cstep" onclick="cartChg('+c.pid+','+c.sizeIdx+',-1)">−</button>'+
          '<span class="qty">'+c.qty+'</span>'+
          '<button class="cstep" onclick="cartChg('+c.pid+','+c.sizeIdx+',1)">+</button>'+
          '<span style="margin-right:5px">'+esc(lbl)+'</span></div>'+
          '<span style="font-weight:700;color:#17140f">'+SYM+(Math.round(c.qty*UP(p)*100)/100)+'</span></div>';
      });
      html += '</div>';
    });
    html += '<div class="tot">'+
      '<div class="tline"><span>סה״כ '+TW+'</span><span>'+units+'</span></div>'+
      '<div class="tbig"><span>סה״כ</span><span>'+SYM+(Math.round(total*100)/100)+'</span></div>'+
      '<button class="send" onclick="sendWA()"><i class="ti ti-brand-whatsapp"></i>שלח הזמנה בוואטסאפ</button>'+
      '<button class="send2" onclick="dlXlsx()"><i class="ti ti-download"></i>הורד קובץ אקסל</button></div>';
    body.innerHTML = html;
  }

  function openCart(){ document.getElementById('cartPanel').classList.add('open'); }
  function closeCart(){ document.getElementById('cartPanel').classList.remove('open'); }

  function dlXlsx(){ sendWA(true); }
  function sendWA(forceDownload){
    if (!cart.length) { alert('העגלה ריקה'); return; }
    var lines = [], total = 0, totalPairs = 0;
    var csvRows = [['מק"ט','שם','מידה / סדרה','כמות',TW,'מחיר יחידה','סה"כ שורה']];
    cart.forEach(function(c){
      var p = DATA.products[c.pid], s = p.sizes[c.sizeIdx];
      var lt = c.qty * UP(p); total += lt;
      var pairs = pairsOf(p, c.qty); totalPairs += pairs;
      var lbl = p.seriesMode ? (PK(p)+' ('+(p.seriesPairs||0)+' '+PW(p)+')') : ('מידה '+s.s);
      lines.push('• '+p.sku+' '+p.name+' | '+lbl+' ×'+c.qty+' — '+SYM+(Math.round(lt*100)/100));
      csvRows.push([p.sku, p.name, p.seriesMode?(PK(p)+' '+(p.seriesPairs||0)):s.s, c.qty, pairs, UP(p), Math.round(lt*100)/100]);
    });
    csvRows.push(['','','','','','סה"כ', Math.round(total*100)/100]);
    csvRows.push(['','','','סה"כ '+TW, totalPairs, '', '']);
    var fname = 'הזמנה_'+DATA.brandName+'.xlsx';
    var txt = 'הזמנה מקטלוג '+DATA.brandName+'\n\n'+lines.join('\n')+
      '\n\nסה"כ '+TW+': '+totalPairs+'\nסה"כ לתשלום: '+SYM+(Math.round(total*100)/100);

    var blob = null;
    try {
      var ws = XLSX.utils.aoa_to_sheet(csvRows);
      ws['!cols'] = [{wch:16},{wch:26},{wch:16},{wch:8},{wch:8},{wch:12},{wch:12}];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'הזמנה');
      var arr = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      blob = new Blob([arr], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    } catch(e) {}

    function saveBlob(){
      if (!blob) return;
      try {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      } catch(e) {}
    }
    function fallback(){
      saveBlob();
      window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(
        txt + '\n\n📎 מצורף קובץ אקסל מסודר (מק"ט/מידה/כמות) — הורד ושלח לי אותו כאן.'
      ), '_blank');
    }
    if (forceDownload) { saveBlob(); return; }

    // Share the file itself. Chrome/Android only allows an allow-listed MIME,
    // so try real xlsx first, then CSV, then fall back to a text message.
    if (!forceDownload && navigator.canShare) {
      var cands = [];
      if (blob) cands.push(new File([blob], fname,
        { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      var csv = csvRows.map(function(r){
        return r.map(function(c){
          c = (c == null ? '' : String(c));
          return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
        }).join(',');
      }).join('\n');
      cands.push(new File(['\ufeff' + csv], 'הזמנה_' + DATA.brandName + '.csv', { type: 'text/csv' }));
      for (var ci = 0; ci < cands.length; ci++) {
        var f2 = cands[ci];
        try {
          if (navigator.canShare({ files: [f2] })) {
            navigator.share({ files: [f2], title: f2.name })
              .catch(function(err){
                if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
                fallback();
              });
            return;
          }
        } catch(e) {}
      }
    }
    fallback();
  }

  renderFilters();
  render();
</script>
